<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="bootstrap.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  <title>Employee Management System</title>
</head>
<body>
  <div class="container">
    <!-- Registration Section -->
    <section class="registration-section">
      <h2 class="form-title">
        <i class="fas fa-user-plus me-2"></i>
        New Employee Registration
      </h2>

      <form id="employeeForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="employeeName" class="form-label">
              <i class="fas fa-user me-2"></i>Employee Name</label>
            <input
              type="text"
              class="form-control"
              id="employeeName"
              placeholder="Enter full name"
              required
            />
          </div>

          <div class="col-md-6 mb-3">
            <label for="jobTitle" class="form-label">
              <i class="fas fa-briefcase me-2"></i>Job Title</label>
            <select class="form-select" id="jobTitle">
              <option value="" selected disabled>Select job title</option>
              <option value="Manager">Manager</option>
              <option value="Developer">Developer</option>
              <option value="Designer">Designer</option>
              <option value="Accountant">Accountant</option>
              <option value="Marketer">Marketer</option>
              <option value="HR">HR</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="employeeEmail" class="form-label">
              <i class="fas fa-envelope me-2"></i>Email</label>
            <input
              type="email"
              class="form-control"
              id="employeeEmail"
              placeholder="info@company.com"/>
          </div>

          <div class="col-md-6 mb-3">
            <label for="employeePhone" class="form-label">
              <i class="fas fa-phone me-2"></i>Phone Number</label>
            <input
              type="tel"
              class="form-control"
              id="employeePhone"
              placeholder="+20 19954787"
            />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="department" class="form-label">
              <i class="fas fa-building me-2"></i>Department</label>
            <select class="form-select" id="department">
              <option value="" selected disabled>Select department</option>
              <option value="IT">IT</option>
              <option value="Marketing">Marketing</option>
              <option value="Sales">Sales</option>
              <option value="Customer Service">Customer Service</option>
              <option value="Human Resources">Human Resources</option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label for="hireDate" class="form-label">
              <i class="fas fa-calendar me-2"></i>Hire Date</label>
            <input type="date" class="form-control" id="hireDate"/>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary btn-lg shadow-lg" id="submitBtn">
            <i class="fas fa-plus-circle me-2"></i>Add Employee</button>
        </div>
      </form>
    </section>

    <!-- Search Section -->
    <div class="search-box position-relative my-4">
      <input 
        type="text" 
        id="searchInput" 
        class="form-control pe-5" 
        placeholder="Search for an Employee..."
        onkeyup="searchEmployees(this.value)">
      <i class="fas fa-search search-icon"></i>
    </div>

    <!-- Table Section -->
    <table class="table mt-5 text-center">
      <thead>
        <tr>
          <th>Name</th>
          <th>Job Title</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Department</th>
          <th>Hire Date</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <script src="bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
